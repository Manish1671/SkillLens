services:
  postgres:
    image: postgres:16-alpine
    container_name: skilllens-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skilllens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skilllens}
      POSTGRES_DB: ${POSTGRES_DB:-skilllens}
    volumes:
      - skilllens_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skilllens} -d ${POSTGRES_DB:-skilllens}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  skilllens_pg_data:
