databases:
  - name: skilllens-db
    plan: free
    databaseName: skilllens
    user: skilllens

services:
  - type: web
    name: skilllens-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skilllens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SKILLENS_DEMO_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: skilllens-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: http://skilllens-api:10000
      - key: HOSTNAME
        value: 0.0.0.0
